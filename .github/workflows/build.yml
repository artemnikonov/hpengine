# Build only: the engine, the tests that need no game files, and the three release packages.
# No game files exist on the runner; publish.sh fails the build if a package would contain any.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the style check diffs against the PR base / previous push

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: C# whitespace style of changed files does not get worse (.editorconfig)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$BASE" in ""|0000000000000000000000000000000000000000) echo "no base commit: style check skipped"; exit 0 ;; esac
          # a force-pushed (amended) history may not contain the previous push
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "base $BASE not in history: style check skipped"; exit 0; }
          sh hpengine/tests/style_check.sh "$BASE"

      - name: Build HPEngine
        run: dotnet build hpengine/HPEngine.csproj -c Release

      - name: Tests without game files
        run: sh hpengine/tests/run_all.sh

      - name: Packages win-x64 linux-x64 osx-arm64 osx-x64
        run: sh hpengine/packaging/publish.sh --out "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: HPEngine-packages
          path: |
            ${{ runner.temp }}/pkg/HPEngine-win-x64.zip
            ${{ runner.temp }}/pkg/HPEngine-linux-x64.tar.gz
            ${{ runner.temp }}/pkg/HPEngine-osx-arm64.tar.gz
          if-no-files-found: error
